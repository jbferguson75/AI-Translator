[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-translator-scripture-plugin"
version = "0.1.0"
description = "Scripture-specific evaluators and review reports for AI Translator"
requires-python = ">=3.15,<3.16"
dependencies = ["ai-translator>=0.1.0", "typer>=0.12,<1.0"]

[project.scripts]
scripture = "scripture_plugin.cli:run"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
scripture_plugin = ["data/*.json"]
