[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-translator"
version = "0.1.0"
description = "Local-first AI translation and evaluation platform"
requires-python = ">=3.15,<3.16"
dependencies = [
  "SQLAlchemy>=2.0,<3.0",
  "alembic>=1.13,<2.0",
  "typer>=0.12,<1.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
ai_translator = ["resources/prompts/*.txt"]

[project.scripts]
ai-translator = "ai_translator.interfaces.cli:run"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

